name: Campus MCP synthetic checks

on:
  push:
    paths: ['campus-mcp/**', '.github/workflows/campus-mcp.yml']
  pull_request:
    paths: ['campus-mcp/**', '.github/workflows/campus-mcp.yml']

permissions:
  contents: read

jobs:
  quality:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: campus-mcp
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install uv==0.13.7
      - run: uv sync --locked --extra dev --no-editable --python ${{ matrix.python }}
      - run: .venv/bin/ruff check src tests scripts
      - run: .venv/bin/ruff format --check src tests scripts
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python scripts/smoke_mcp.py
