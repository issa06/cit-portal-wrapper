[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cit-campus-mcp"
version = "0.1.7"
description = "Read-only MCP server for Chiba Institute of Technology Portal, manaba, and student documents."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "issa06"}]
dependencies = [
  "mcp>=2,<3",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.13,<5",
  "lxml>=5.3,<7",
  "pypdf>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9"]

[project.scripts]
cit-campus-mcp = "cit_campus_mcp.server:main"
cit-campus-login-test = "cit_campus_mcp.cli:login_test"
cit-campus-keyring = "cit_campus_mcp.cli:keyring_setup"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
